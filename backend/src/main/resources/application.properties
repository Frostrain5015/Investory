server.port=8080
server.servlet.context-path=/investory

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/investory?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:REDACTED_DB_PW}

# Python 可执行文件名：Windows 通常为 python，Linux 为 python3
# 可通过环境变量 PYTHON_EXEC 覆盖
python.executable=${PYTHON_EXEC:python}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=InvestoryPool

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
