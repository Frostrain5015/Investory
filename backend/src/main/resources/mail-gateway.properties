# Standalone mail gateway. Same SMTP variable names as PP Typeset; no shared secrets.
investory.mail.enabled=${MAIL_GATEWAY_ENABLED:false}
investory.mail.host=${SMTP_HOST:}
investory.mail.port=${SMTP_PORT:465}
investory.mail.username=${SMTP_USER:}
investory.mail.password=${SMTP_PASS:}
investory.mail.from=${SMTP_FROM:${SMTP_USER:}}
# SSL (465), STARTTLS (usually 587), PLAIN (loopback test server only).
investory.mail.security=${SMTP_SECURITY:SSL}
investory.mail.timeout-ms=${SMTP_TIMEOUT_MS:5000}
