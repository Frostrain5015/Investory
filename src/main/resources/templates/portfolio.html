<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('我的组合')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-4" style="max-width:600px">
    <h5 class="fw-bold mb-4">我的投资组合</h5>

    <!-- Create form -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body">
            <form th:action="@{/portfolio}" method="post" class="d-flex gap-2">
                <input type="hidden" name="action" value="create">
                <input type="text" name="name" class="form-control" placeholder="新建组合名称" required maxlength="100">
                <button type="submit" class="btn btn-success text-nowrap"><i class="bi bi-plus-lg me-1"></i>新建</button>
            </form>
        </div>
    </div>

    <!-- Portfolio list -->
    <div class="card border-0 shadow-sm rounded-4" th:if="${!portfolios.isEmpty()}">
        <ul class="list-group list-group-flush rounded-4">
            <li class="list-group-item d-flex justify-content-between align-items-center"
                th:each="p : ${portfolios}">
                <div>
                    <i class="bi bi-briefcase me-2 text-muted"></i>
                    <span class="fw-semibold" th:text="${p.name}"></span>
                    <small class="text-muted ms-2" th:text="'创建于 ' + ${#temporals.format(p.createdAt,'yyyy-MM-dd')}"></small>
                </div>
                <form th:action="@{/portfolio}" method="post"
                      onsubmit="return confirm('确认删除此组合？相关数据将一并删除。')">
                    <input type="hidden" name="action" value="delete">
                    <input type="hidden" name="id" th:value="${p.id}">
                    <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
                </form>
            </li>
        </ul>
    </div>

    <p class="text-center text-muted mt-4" th:if="${portfolios.isEmpty()}">还没有组合，新建一个开始记账吧！</p>

    <div class="text-center mt-4">
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary">返回总览</a>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
