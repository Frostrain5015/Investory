<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('交易记录')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container-fluid py-3 px-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">交易记录</h5>
        <a th:href="@{/transactions(view='add')}" class="btn btn-success btn-sm">
            <i class="bi bi-plus-lg me-1"></i>新增交易
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                    <thead class="table-light">
                    <tr>
                        <th>日期</th><th>股票</th>
                        <th>操作</th><th class="text-end">股数</th>
                        <th class="text-end">价格</th><th class="text-end">手续费</th>
                        <th class="text-end">总金额</th><th>备注</th><th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${transactions}">
                        <td th:text="${t.tradeDate}"></td>
                        <td>
                            <a th:href="@{/stock(symbol=${t.stockSymbol})}" class="text-decoration-none fw-semibold"
                               th:text="${t.stockName}"></a>
                        </td>
                        <td>
                            <span th:if="${t.type == 'BUY'}" class="badge bg-danger">买入</span>
                            <span th:if="${t.type == 'SELL'}" class="badge bg-success">卖出</span>
                        </td>
                        <td class="text-end" th:text="${t.shares}"></td>
                        <td class="text-end" th:text="${t.price}"></td>
                        <td class="text-end" th:text="${t.fee}"></td>
                        <td class="text-end fw-semibold" th:text="${t.totalCost}"></td>
                        <td class="text-muted" th:text="${t.note}"></td>
                        <td class="text-end">
                            <form th:action="@{/transactions}" method="post" style="display:inline"
                                  onsubmit="return confirm('确认删除此交易？')">
                                <input type="hidden" name="action" value="delete">
                                <input type="hidden" name="id" th:value="${t.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm py-0"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${transactions.isEmpty()}" class="text-center text-muted py-4">暂无交易记录</p>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
