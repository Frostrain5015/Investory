<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('注册')}"></head>
<body class="d-flex align-items-center bg-dark" style="min-height:100vh">
<div class="container" style="max-width:420px">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-graph-up-arrow text-success" style="font-size:2.5rem"></i>
                <h4 class="fw-bold mt-2">创建账号</h4>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label">用户名 <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control"
                           th:value="${username}" required autofocus maxlength="50">
                </div>
                <div class="mb-3">
                    <label class="form-label">密码 <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control"
                           required minlength="6" placeholder="至少6位">
                </div>
                <div class="mb-3">
                    <label class="form-label">邮箱（选填）</label>
                    <input type="email" name="email" class="form-control" th:value="${email}">
                </div>
                <button type="submit" class="btn btn-success w-100 fw-semibold">注册</button>
            </form>
            <p class="text-center mt-3 small text-muted">
                已有账号？<a th:href="@{/login}">去登录</a>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
