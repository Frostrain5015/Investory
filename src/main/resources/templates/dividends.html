<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('分红记录')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container-fluid py-3 px-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">股息分红记录</h5>
        <a th:href="@{/dividends(view='add')}" class="btn btn-success btn-sm">
            <i class="bi bi-plus-lg me-1"></i>录入分红
        </a>
    </div>
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                    <thead class="table-light">
                    <tr>
                        <th>记录日</th><th>股票</th>
                        <th class="text-end">每股分红</th>
                        <th class="text-end">持有股数</th>
                        <th class="text-end">总金额</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${dividends}">
                        <td th:text="${d.recordDate}"></td>
                        <td>
                            <a th:href="@{/stock(symbol=${d.stockSymbol})}" class="fw-semibold text-decoration-none"
                               th:text="${d.stockName}"></a>
                        </td>
                        <td class="text-end" th:text="${d.amountPerShare}"></td>
                        <td class="text-end" th:text="${d.sharesHeld}"></td>
                        <td class="text-end fw-semibold text-success" th:text="${d.totalAmount}"></td>
                        <td class="text-end">
                            <form th:action="@{/dividends}" method="post" style="display:inline"
                                  onsubmit="return confirm('确认删除此分红记录？')">
                                <input type="hidden" name="action" value="delete">
                                <input type="hidden" name="id" th:value="${d.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm py-0"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${dividends.isEmpty()}" class="text-center text-muted py-4">暂无分红记录</p>
        </div>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
