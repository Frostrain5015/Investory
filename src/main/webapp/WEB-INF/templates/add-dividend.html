<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('录入分红')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-4" style="max-width:480px">
    <h5 class="fw-bold mb-4"><i class="bi bi-cash-coin me-2 text-success"></i>录入现金分红</h5>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <form th:action="@{/dividends}" method="post">
                <div class="mb-3">
                    <label class="form-label">选择股票（仅显示持仓）</label>
                    <select name="stockId" class="form-select" required>
                        <option value="">— 请选择 —</option>
                        <option th:each="s : ${snapshots}"
                                th:value="${s.stockId}"
                                th:text="${s.stockName + '（' + s.totalShares + ' 股）'}">
                        </option>
                    </select>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label">每股分红金额</label>
                        <input type="number" name="amountPerShare" class="form-control"
                               min="0.000001" step="0.000001" placeholder="0.50" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">分红记录日</label>
                        <input type="date" name="recordDate" class="form-control" required
                               th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}">
                    </div>
                </div>
                <p class="text-muted small">总分红金额将按「每股分红 × 当前持仓股数」自动计算。</p>
                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/dividends}" class="btn btn-outline-secondary">取消</a>
                    <button type="submit" class="btn btn-success fw-semibold">确认</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
