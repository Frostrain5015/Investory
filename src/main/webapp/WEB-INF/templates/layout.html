<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — 盈亏鉴'">盈亏鉴</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>

<!-- Navigation bar fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-graph-up-arrow me-1 text-success"></i>盈亏鉴
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>总览</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/holdings}"><i class="bi bi-wallet2 me-1"></i>持仓</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/transactions}"><i class="bi bi-arrow-left-right me-1"></i>交易</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dividends}"><i class="bi bi-cash-coin me-1"></i>分红</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pnl-calendar}"><i class="bi bi-calendar3 me-1"></i>盈亏历</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${sessionUsername}">用户</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/portfolio}"><i class="bi bi-briefcase me-2"></i>我的组合</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i>退出</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Footer fragment -->
<footer th:fragment="footer" class="footer mt-auto py-3 bg-dark text-secondary">
    <div class="container text-center">
        <small>盈亏鉴 Investory &copy; 2025 &nbsp;·&nbsp; 数据来源：东方财富</small>
    </div>
</footer>

<body></body>
</html>
