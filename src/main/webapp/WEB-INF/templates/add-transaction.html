<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('新增交易')}"></head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container py-4" style="max-width:560px">
    <h5 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2 text-success"></i>新增交易</h5>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <form th:action="@{/transactions}" method="post" id="txnForm">

                <!-- Stock search -->
                <div class="mb-3">
                    <label class="form-label">股票搜索</label>
                    <input type="text" id="stockSearch" class="form-control" placeholder="输入股票名称或代码..."
                           autocomplete="off">
                    <div id="searchResults" class="list-group mt-1 shadow-sm" style="display:none;position:absolute;z-index:99;width:calc(100% - 3rem)"></div>
                    <input type="hidden" name="stockId" id="stockId" required>
                    <small id="selectedStock" class="text-success mt-1 d-block"></small>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label">操作类型</label>
                        <select name="type" class="form-select" required>
                            <option value="BUY">买入</option>
                            <option value="SELL">卖出</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label">交易日期</label>
                        <input type="date" name="tradeDate" class="form-control"
                               th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-4">
                        <label class="form-label">股数</label>
                        <input type="number" name="shares" class="form-control" min="0.0001" step="0.0001"
                               placeholder="100" required>
                    </div>
                    <div class="col-4">
                        <label class="form-label">成交价格</label>
                        <input type="number" name="price" class="form-control" min="0.0001" step="0.0001"
                               placeholder="50.00" required id="priceInput">
                    </div>
                    <div class="col-4">
                        <label class="form-label">手续费</label>
                        <input type="number" name="fee" class="form-control" min="0" step="0.01"
                               placeholder="5.00" value="0">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">备注（选填）</label>
                    <input type="text" name="note" class="form-control" placeholder="如：定投、加仓">
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/transactions}" class="btn btn-outline-secondary">取消</a>
                    <button type="submit" class="btn btn-success fw-semibold">确认提交</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
const CTX = [[${contextPath}]];
let searchTimer;
document.getElementById('stockSearch').addEventListener('input', function () {
    clearTimeout(searchTimer);
    const q = this.value.trim();
    if (q.length < 1) { document.getElementById('searchResults').style.display = 'none'; return; }
    searchTimer = setTimeout(() => {
        fetch(CTX + '/api/stock/search?q=' + encodeURIComponent(q))
            .then(r => r.json()).then(data => {
                const box = document.getElementById('searchResults');
                box.innerHTML = '';
                if (!data.length) { box.style.display = 'none'; return; }
                data.forEach(s => {
                    const a = document.createElement('a');
                    a.className = 'list-group-item list-group-item-action py-2';
                    a.href = '#';
                    a.innerHTML = `<strong>${s.name}</strong> <small class="text-muted">${s.symbol}</small> <span class="badge bg-secondary ms-1">${s.market}</span>`;
                    a.addEventListener('click', e => {
                        e.preventDefault();
                        document.getElementById('stockId').value = s.id;
                        document.getElementById('stockSearch').value = s.name;
                        document.getElementById('selectedStock').textContent = '已选：' + s.name + '（' + s.symbol + '）';
                        box.style.display = 'none';
                    });
                    box.appendChild(a);
                });
                box.style.display = 'block';
            });
    }, 300);
});
document.addEventListener('click', e => {
    if (!e.target.closest('#stockSearch') && !e.target.closest('#searchResults'))
        document.getElementById('searchResults').style.display = 'none';
});
</script>
</body>
</html>
