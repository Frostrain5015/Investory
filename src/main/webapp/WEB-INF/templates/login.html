<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('登录')}"></head>
<body class="d-flex align-items-center bg-dark" style="min-height:100vh">
<div class="container" style="max-width:400px">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-graph-up-arrow text-success" style="font-size:2.5rem"></i>
                <h4 class="fw-bold mt-2">盈亏鉴</h4>
                <p class="text-muted small">Investment Portfolio Tracker</p>
            </div>

            <div th:if="${param.registered}" class="alert alert-success py-2">注册成功，请登录</div>
            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-semibold">登录</button>
            </form>
            <p class="text-center mt-3 small text-muted">
                没有账号？<a th:href="@{/register}">立即注册</a>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
