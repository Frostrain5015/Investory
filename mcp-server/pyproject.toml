[project]
name = "investory-mcp-server"
version = "1.0.0"
description = "Investory MCP Server — exposes portfolio, stock, and quant tools to AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pymysql>=1.1.0",
    "pyyaml>=6.0",
    "starlette>=0.38.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
